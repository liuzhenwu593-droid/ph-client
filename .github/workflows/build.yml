name: Build PsexHub APK
# NOTE: Flutter project is in app/; this workflow lives at repo root so GitHub runs it.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-debug:
    name: Flutter analyze + debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=CI_RUN_NUMBER=${{ github.run_number }}

      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ph-player-debug-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish debug APK to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: "CI 最新构建（PsexHub 0.2.0）"
          prerelease: true
          files: app/build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: false

  build-release:
    name: Build signed release APK
    defaults:
      run:
        working-directory: app
    # 需要先在仓库 Settings > Secrets and variables > Actions 里配置签名
    # （与 shadiao-v5 同名 Secrets，需用户手动加到本仓库，Secrets 不会随
    # 复制仓库自动过来）：
    #   ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
    # 未配置时本任务自动跳过（显示为成功），不阻塞 CI。
    # 密钥必须新生成（不要复用其他 App 的签名密钥），keystore 文件本身
    # 绝不要提交进仓库。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: check
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "未配置签名 Secrets，跳过 release 打包（flutter-debug 仍正常执行）。"
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.has_secrets == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.35.7
        if: steps.check.outputs.has_secrets == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Restore release keystore
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/phclient-release.jks
          chmod 600 android/phclient-release.jks

      - name: Write keystore.properties
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=phclient-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.has_secrets == 'true'
        run: chmod +x android/gradlew

      - name: Install dependencies
        if: steps.check.outputs.has_secrets == 'true'
        run: flutter pub get

      - name: Build release APK
        if: steps.check.outputs.has_secrets == 'true'
        run: flutter build apk --release --dart-define=CI_RUN_NUMBER=${{ github.run_number }}

      - name: Upload APK artifacts
        if: steps.check.outputs.has_secrets == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ph-player-signed-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish signed APK to rolling release
        if: steps.check.outputs.has_secrets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: "CI 最新构建（PsexHub 0.2.0）"
          prerelease: true
          files: app/build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: false
