name: ph_player
description: "计算器 — 一个普通的计算器。"
publish_to: "none"
version: 0.2.11+13

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # HLS (m3u8) playback on Android is ExoPlayer under the hood.
  video_player: ^2.9.5
  shared_preferences: ^2.3.2
  # Swipe left side = screen brightness (real system brightness).
  screen_brightness: ^2.1.0
  # Offline downloads are stored in the app's documents directory.
  path_provider: ^2.1.0
  # Thumbnails: disk cache + browser headers (phncdn 403s Referer-less
  # requests on pix-cdn77, ~half of all thumbs — verified live 2026-11-22).
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  # Auto-play previews: which list card is on screen (v0.2.2).
  visibility_detector: ^0.4.0+2
  # Screen wakelock while playing (v0.2.11). Pinned to 1.3.3 on purpose:
  # 1.4.0+ requires package_info_plus ^9.0.0, whose kotlin-stdlib 2.2.0
  # the project's Kotlin 1.9.21 compiler cannot read (CI build failure
  # 2026-11-25, run 45469269420). 1.3.3 caps it at <9.0.0.
  wakelock_plus: 1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
