name: ph_player
description: "PsexHub — third-party video client: home, categories, search, favorites, offline downloads, resume."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # HLS (m3u8) playback on Android is ExoPlayer under the hood.
  video_player: ^2.9.5
  shared_preferences: ^2.3.2
  # Swipe left side = screen brightness (real system brightness).
  screen_brightness: ^2.1.0
  # Offline downloads are stored in the app's documents directory.
  path_provider: ^2.1.0
  # App PIN lock stores only the SHA-256 of the PIN.
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
